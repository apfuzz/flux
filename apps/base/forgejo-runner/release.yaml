---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
  namespace: forgejo
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  driftDetection:
    mode: enabled
  values:
    knownLastVersion: true
    runner:
      config:
        create: false
        existingSecret: forgejo-runner
