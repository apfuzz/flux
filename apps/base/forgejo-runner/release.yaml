---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
  namespace: forgejo
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  driftDetection:
    mode: enabled
  values:
    knownLastVersion: true
    runner:
      config:
        existingInitSecret: forgejo-runner-init
        file:
          runner:
            labels:
              - kubernetes:docker://docker.io/library/node:lts
