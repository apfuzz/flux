---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: logging
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: loki
      version: "18.11.3"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  driftDetection:
    mode: enabled
  values: {}
