---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-test-rules
  namespace: logging
  labels:
    loki_rule: "1"
  annotations:
    loki_rule_folder: "1"
data:
  talos.yaml: |
    groups:
      - name: talos-nvme
        interval: 1m
        rules:
          - alert: TalosNVMeControllerFailure
            expr: |
              sum by (talos_server) (
                count_over_time(
                  {job="talos", talos_service="kernel"}
                    |~ "(?i)nvme.*(timeout|reset controller|device not ready|aborting reset|not ready .* after FLR)"
                  [2m]
                )
              ) > 0
            labels:
              severity: critical
            annotations:
              summary: "NVMe controller failure on {{ $labels.talos_server }}"
              description: "Talos kernel logs indicate an NVMe controller timeout/reset or failed recovery on {{ $labels.talos_server }}."
