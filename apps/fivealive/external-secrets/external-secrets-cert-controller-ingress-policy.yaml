apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-cert-controller-ingress
  namespace: external-secrets
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-cert-controller

  ingress:
    # Kubelet readiness probe (/readyz on the ready port)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP

    # Prometheus scraping (external-secrets-cert-controller-metrics ServiceMonitor)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
            k8s:app.kubernetes.io/instance: kps-prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
