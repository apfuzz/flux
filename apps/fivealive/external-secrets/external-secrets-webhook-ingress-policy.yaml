apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-webhook-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook

  ingress:
    # API server admission calls for externalsecret-validate. The apiserver
    # reaches the webhook through the tunnel, arriving as remote-node.
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP

    # Kubelet readiness probe (/readyz on the ready port). remote-node covers
    # the kubelet running on a different node than the pod.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP

    # Prometheus scraping (external-secrets-webhook-metrics ServiceMonitor)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
            k8s:app.kubernetes.io/instance: kps-prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
