---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-test-rules
  namespace: logging
  labels:
    loki_rule: "1"
  annotations:
    loki_rule_folder: "1"
data:
  test.yaml: |
    groups:
      - name: loki-test
        interval: 30s
        rules:
          - alert: LokiTestAlert
            expr: |
              sum(count_over_time({job="fluent-bit"}[5m])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Loki ruler test alert"
              description: "Loki has seen at least one fluent-bit log line in the last five minutes."
