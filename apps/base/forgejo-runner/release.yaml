---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
  namespace: forgejo
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: forgejo-runner
      version: ">= 0.1.0"
      sourceRef:
        kind: HelmRepository
        name: forgejo-runner
  driftDetection:
    mode: enabled
  values:
    runner:
      config:
        create: false
        existingSecret: forgejo-runner
        file:
          runner:
            labels:
              - kubernetes:docker://docker.io/library/node:lts
