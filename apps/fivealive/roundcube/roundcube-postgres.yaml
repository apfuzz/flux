apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: roundcube-postgres
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: roundcube-postgres
    template:
      engineVersion: v2
      data:
        username: "roundcube"
        password: "{{ .password | toString }}"
  data:
    - secretKey: password
      remoteRef:
        key: cnpg
        property: roundcube
