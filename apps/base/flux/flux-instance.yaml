---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
spec:
  distribution:
    version: "2.9.x"
    registry: "ghcr.io/fluxcd"
    artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
  components:
    - source-controller
    - source-watcher
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    size: small
    networkPolicy: false
  sync:
    kind: GitRepository
    interval: 1m
    url: "ssh://git@git.gangsterkitties.com:1022/aaron/flux.git"
    ref: "refs/heads/main"
    path: json-patch-will-replace-this
    pullSecret: "flux-forgejo"
