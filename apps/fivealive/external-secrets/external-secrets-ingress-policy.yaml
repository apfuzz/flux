apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets

  ingress:
    # Prometheus scraping (external-secrets-metrics ServiceMonitor)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
            k8s:app.kubernetes.io/instance: kps-prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
