apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-canary-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: canary

  ingress:
    # Kubelet probes
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3500"
              protocol: TCP

    # Prometheus scraping
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
            k8s:app.kubernetes.io/instance: kps-prometheus
      toPorts:
        - ports:
            - port: "3500"
              protocol: TCP
