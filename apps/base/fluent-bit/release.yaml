---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  interval: 15m
  timeout: 5m
  dependsOn:
    -name: loki
  chart:
    spec:
      chart: fluent-bit
      version: "0.58.x"
      sourceRef:
        kind: HelmRepository
        name: fluent
  driftDetection:
    mode: enabled
  values: {}
