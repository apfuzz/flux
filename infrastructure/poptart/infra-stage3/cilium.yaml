---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium
spec:
  values:
    # Set explicitly: the configmap still carries envoy-xds-mode=ads from the
    # 1.20.3 template. 1.20.4 no longer renders the key when unset, so the
    # stale value survives the upgrade. The standalone Envoy DaemonSet speaks
    # the split protocol.
    envoy:
      xdsMode: split
    ingressController:
      service:
        annotations:
          external-dns.kubernetes.io/hostname: poptart-ingress.gangsterkitties.com
          lbipam.cilium.io/ips: 10.0.102.254
    hubble:
      ui:
        ingress:
          annotations:
            external-dns.kubernetes.io/target: poptart-ingress.gangsterkitties.com
          hosts:
            - poptart-hubble.gangsterkitties.com
          tls:
            - hosts:
                - poptart-hubble.gangsterkitties.com
