---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fivealive
  namespace: postgres
spec:
  instances: 3
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backups-postgres-fivealive
  storage:
    size: 1Gi
  resources:
    limits:
      memory: 256Mi
    requests:
      memory: 256Mi
  enableSuperuserAccess: true
  superuserSecret:
    name: fivealive-postgres
  managed:
    roles:
      - name: dex
        comment: Dex IdP DB User
        login: true
        passwordSecret:
          name: fivealive-dex
      - name: roundcube
        comment: Roundcube DB User
        login: true
        passwordSecret:
          name: fivealive-roundcube
  monitoring:
    enablePodMonitor: false  # deprecated - use custom pod monitor instead
