---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: traefik
      version: "41.4.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    ingressClass:
      isDefaultClass: false
    gateway:
      enabled: false
    ingressRoute:
      dashboard:
        enabled: true
        entryPoints: ["websecure"]
    providers:
      kubernetesCRD:
        safeNaming: false
    metrics:
      prometheus:
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kps
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          encodedCharacters:
            allowEncodedSlash: true
    tlsStore:
      default:
        defaultCertificate:
          secretName: wildcard
