---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: openbao
      version: "0.29.1"
      sourceRef:
        kind: HelmRepository
        name: openbao
  driftDetection:
    mode: enabled
  values:
    global:
      serverTelemetry:
        prometheusOperator: true
    injector:
      enabled: false
    server:
      gateway:
        httpRoute:
          enabled: true
          parentRefs:
            - name: cilium-gateway
              namespace: cilium
              sectionName: https
      extraEnvironmentVars:
        VAULT_SEAL_TYPE: awskms
        AWS_REGION: us-east-1
      extraSecretEnvironmentVars:
        - envName: AWS_ACCESS_KEY_ID
          secretName: aws-vault
          secretKey: AWS_ACCESS_KEY_ID
        - envName: AWS_SECRET_ACCESS_KEY
          secretName: aws-vault
          secretKey: AWS_SECRET_ACCESS_KEY
        - envName: VAULT_AWSKMS_SEAL_KEY_ID
          secretName: aws-vault
          secretKey: VAULT_AWSKMS_SEAL_KEY_ID
      standalone:
        enabled: false
      ha:
        enabled: true
        replicas: 1
        disruptionBudget:
          enabled: false
        raft:
          enabled: true
          config: |
            ui = true

            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
              telemetry {
                unauthenticated_metrics_access = "true"
              }
            }

            storage "raft" {
              path = "/openbao/data"
            }

            telemetry {
              prometheus_retention_time = "30s"
              disable_hostname = true
            }

            service_registration "kubernetes" {}
            unsafe_allow_api_audit_creation = true

            plugin_directory = "/opt/openbao/plugins"

            plugin_auto_download = true
            plugin_auto_register = true

            plugin "auth" "aws" {
              image       = "ghcr.io/openbao/openbao-plugin-kms-aws"
              version     = "v0.1.0"
              binary_name = "openbao-plugin-kms-aws"
              sha256sum   = "fe9fb94872048c9474156c044ea8852bb5c2e968fc9304a3725e4d434b488541"
            }
    ui:
      enabled: true
    serverTelemetry:
      serviceMonitor:
        enabled: true
        selectors:
          release: kps
      prometheusRules:
        enabled: true
        selectors:
          release: kps
        rules:
          - alert: vault-HighResponseTime
            annotations:
              message: The response time of OpenBao is over 500ms on average over the last 5 minutes.
            expr: vault_core_handle_request{quantile="0.5", namespace="mynamespace"} > 500
            for: 5m
            labels:
              severity: warning
          - alert: vault-HighResponseTime
            annotations:
              message: The response time of OpenBao is over 1s on average over the last 10 minutes.
            expr: vault_core_handle_request{quantile="0.5", namespace="mynamespace"} > 1000
            for: 10m
            labels:
              severity: critical
      grafanaDashboard:
        enabled: true
    initContainers:
      - name: fix-permissions
        image: busybox
        command: ['sh', '-c', 'chmod 600 /vault/data/vault.db && mkdir -p /opt/openbao/plugins && chown openbao:openbao /opt/openbao/plugins']
        volumeMounts:
          - name: data
            mountPath: /vault/data
