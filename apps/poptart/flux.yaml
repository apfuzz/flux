---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  interval: 15m
  values:
    web:
      config:
        baseURL: https://poptart-flux.gangsterkitties.com
      networkPolicy:
        create: false
      httpRoute:
        annotations:
          external-dns.alpha.kubernetes.io/target: poptart-gateway.gangsterkitties.com
        hostnames:
          - host: poptart-flux.gangsterkitties.com
