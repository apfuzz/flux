apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dex-ingress
  namespace: dex
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dex

  ingress:
    # Traefik (dex.gangsterkitties.com, legacy Ingress)
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5556"
              protocol: TCP

    # Kubelet probes (/healthz on the http port, status on 5558)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "5556"
              protocol: TCP
            - port: "5558"
              protocol: TCP

    # Prometheus scraping /metrics
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
            k8s:app.kubernetes.io/instance: kps-prometheus
      toPorts:
        - ports:
            - port: "5558"
              protocol: TCP
