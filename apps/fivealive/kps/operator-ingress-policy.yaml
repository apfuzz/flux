apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: operator-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kps-prometheus-operator

  ingress:
    # Kubelet probes (/healthz on the https port). remote-node covers the case
    # where the kubelet runs on a different node than the pod.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP

    # Prometheus scraping (kps-operator ServiceMonitor, https on 443 -> 10250)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
            k8s:app.kubernetes.io/instance: kps-prometheus
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
