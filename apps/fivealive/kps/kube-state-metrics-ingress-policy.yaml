apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-state-metrics-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics

  ingress:
    # Kubelet probes: /livez on the http port, /readyz on the telemetry port
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP

    # Prometheus scraping (kps-kube-state-metrics ServiceMonitor, http)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
            k8s:app.kubernetes.io/instance: kps-prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
