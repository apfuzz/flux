apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-manager-ingress
  namespace: longhorn
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-manager

  ingress:
    # API server admission calls (validator.longhorn.io, failurePolicy: Fail),
    # plus the kubelet's readiness endpoint. Both arrive as node traffic; the
    # apiserver may be local (host) or on another node (remote-node).
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9502"
              protocol: TCP

    # Kubelet liveness probe (/v1/healthz on the manager port)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP

    # longhorn-csi-plugin calling the manager API
    - fromEndpoints:
        - matchLabels:
            k8s:app: longhorn-csi-plugin
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP

    # Manager-to-manager API calls between nodes
    - fromEndpoints:
        - matchLabels:
            k8s:app: longhorn-manager
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
            - port: "9502"
              protocol: TCP

    # Prometheus scraping (longhorn ServiceMonitor)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
            k8s:app.kubernetes.io/instance: kps-prometheus
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
