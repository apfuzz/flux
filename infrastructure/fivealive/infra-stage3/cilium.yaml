---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium
spec:
  values:
    resources:
      limits:
        memory: 384Mi
      requests:
        memory: 384Mi
    ingressController:
      service:
        annotations:
          external-dns.kubernetes.io/hostname: fivealive-ingress.gangsterkitties.com
          lbipam.cilium.io/ips: 10.0.101.254
    hubble:
      relay:
        resources: {}
      ui:
        backend:
          resources: {}
        frontend:
          resources: {}
        ingress:
          annotations:
            external-dns.kubernetes.io/target: fivealive-ingress.gangsterkitties.com
          hosts:
            - hubble.gangsterkitties.com
          tls:
            - hosts:
                - hubble.gangsterkitties.com
    envoy:
      resources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
    operator:
      resources:
        limits:
          memory: 256Mi
        requests:
          memory: 256Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: hubble-relay
            patch: |-
              - op: add
                path: /spec/ports/0/appProtocol
                value: kubernetes.io/h2c
