---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  kustomize:
    patches:
      - target:
          kind: Deployment
          name: helm-controller
        patch: |
          - op: replace
            path: /spec/template/spec/containers/0/resources/requests/memory
            value: 160Mi

      - target:
          kind: Deployment
          name: kustomize-controller
        patch: |
          - op: replace
            path: /spec/template/spec/containers/0/resources/requests/memory
            value: 128Mi

      - target:
          kind: Deployment
          name: source-controller
        patch: |
          - op: replace
            path: /spec/template/spec/containers/0/resources/requests/memory
            value: 96Mi
