---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: logging
spec:
  interval: 15m
  values:
    global:
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: loki-oci-credentials
    loki:
      commonConfig:
        replication_factor: 1
      persistence:
        storageClass: longhorn
      schemaConfig:
        configs:
          - from: "2024-04-01"
            object_store: s3
            store: tsdb
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: s3
        bucketNames:
          chunks: loki-chunks-87836769
          ruler: loki-ruler-87836769
        s3:
          endpoint: https://vhcompat.objectstorage.us-ashburn-1.oci.customer-oci.com
          region: us-ashburn-1
          accessKeyId: "${AWS_ACCESS_KEY_ID}"
          secretAccessKey: "${AWS_SECRET_ACCESS_KEY}"
      rulerConfig:
        alertmanager_url: http://kps-alertmanager.monitoring.svc.cluster.local:9093
        storage:
          type: local
          local:
            directory: /rules
    gateway:
      route:
        main:
          enabled: true
          hostnames:
            - loki.gangsterkitties.com
          parentRefs:
            - name: cilium-gateway
              namespace: cilium
              sectionName: https
    chunksCache:
      allocatedMemory: 1024
    sidecar:
      rules:
        folderAnnotation: loki_rule_folder
    monitoring:
      dashboards:
        enabled: true
        annotations:
          grafana_folder: Loki
      serviceMonitor:
        enabled: true
        labels:
          release: kps
