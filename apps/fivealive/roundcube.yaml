apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: roundcube
  namespace: roundcube
spec:
  interval: 15m
  values:
    ingress:
      enabled: true
      className: cilium
      annotations:
        external-dns.alpha.kubernetes.io/target: fivealive-ingress.gangsterkitties.com
      hosts:
        - host: webmail.gangsterkitties.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - webmail.gangsterkitties.com
    persistence:
      enabled: false
    roundcube:
      defaultHost: ssl://mail.gangsterkitties.com
      smtpServer: tls://mail.gangsterkitties.com
      productName: "Gangster Kitties Webmail"
    database:
      type: pgsql
      external:
        host: fivealive-rw.postgres.svc.cluster.local
        port: 5432
        name: roundcube
        user: roundcube
        existingSecret: roundcube-postgres
        existingSecretPasswordKey: password
        existingSecretUserKey: username
