---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/infra-stage3/cilium
  - ../../base/infra-stage3/external-dns
  - ../../base/infra-stage3/traefik
  - ./cilium
patches:
  - path: cilium.yaml
    target:
      kind: HelmRelease
      name: cilium
      namespace: cilium
  - path: external-dns.yaml
    target:
      kind: HelmRelease
      name: external-dns
      namespace: external-dns
  - path: traefik.yaml
    target:
      kind: HelmRelease
      name: traefik
      namespace: traefik
