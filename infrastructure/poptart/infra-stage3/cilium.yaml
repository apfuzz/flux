---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium
spec:
  values:
    ingressController:
      service:
        annotations:
          external-dns.kubernetes.io/hostname: poptart-ingress.gangsterkitties.com
          lbipam.cilium.io/ips: 10.0.102.254
    hubble:
      ui:
        ingress:
          annotations:
            external-dns.kubernetes.io/target: poptart-ingress.gangsterkitties.com
          hosts:
            - host: poptart-hubble.gangsterkitties.com
          tls:
            - hosts:
                - poptart-hubble.gangsterkitties.com
