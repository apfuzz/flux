---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backups-postgres-fivealive
  namespace: postgres
spec:
  configuration:
    destinationPath: s3://backups-87836769/postgres/fivealive
    endpointURL: https://vhcompat.objectstorage.us-ashburn-1.oci.customer-oci.com
    s3Credentials:
      accessKeyId:
        name: backup-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: backup-secret
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
  instanceSidecarConfiguration:
    env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
    - name: AWS_REGION
      value: us-ashburn-1
    - name: AWS_DEFAULT_REGION
      value: us-ashburn-1
  retentionPolicy: 21d
