---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  interval: 15m
  values:
    httpRoute:
      annotations:
        external-dns.alpha.kubernetes.io/target: fivealive-ingress.gangsterkitties.com
      hostnames:
        - headlamp.gangsterkitties.com
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 128Mi
