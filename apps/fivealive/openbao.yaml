---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 15m
  values:
    server:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 128Mi
      gateway:
        httpRoute:
          annotations:
            external-dns.alpha.kubernetes.io/target: fivealive-gateway.gangsterkitties.com
          hosts:
            - vault.gangsterkitties.com
