apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-ui-ingress
  namespace: longhorn
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: longhorn-ui

  ingress:
    # cilium-gateway (longhorn.gangsterkitties.com, HTTPRoute to longhorn-frontend:80)
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP

    # Kubelet probes
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
