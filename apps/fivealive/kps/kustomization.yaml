---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - alertmanager-ingress-policy.yaml
  - grafana-ingress-policy.yaml
  - kube-state-metrics-ingress-policy.yaml
  - llama-secret.yaml
  - node-exporter-ingress-policy.yaml
  - operator-ingress-policy.yaml
  - prometheus-ingress-policy.yaml
configMapGenerator:
  - name: node-exporter-dashboard
    files:
      - dashboards/node-exporter.json
    options:
      labels:
        grafana_dashboard: "1"
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: nvidia-dcgm-exporter-dashboard
    files:
      - dashboards/nvidia-dcgm-exporter.json
    options:
      labels:
        grafana_dashboard: "1"
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: podman-exporter-dashboard
    files:
      - dashboards/podman-exporter.json
    options:
      labels:
        grafana_dashboard: "1"
        kustomize.toolkit.fluxcd.io/substitute: disabled
