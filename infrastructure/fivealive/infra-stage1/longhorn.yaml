---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn
spec:
  interval: 15m
  values:
    httproute:
      enabled: true
      parentRefs:
        - name: cilium-gateway
          namespace: cilium
          sectionName: https
      hostnames:
        - longhorn.gangsterkitties.com
    defaultSettings:
      systemManagedCSIComponentsResourceLimits: |
        {
          "csi-attacher": {
            "requests": {
              "memory": "48Mi"
            }
          },
          "csi-provisioner": {
            "requests": {
              "memory": "48Mi"
            }
          },
          "csi-resizer": {
            "requests": {
              "memory": "48Mi"
            }
          },
          "csi-snapshotter": {
            "requests": {
              "memory": "48Mi"
            }
          },
          "longhorn-csi-plugin": {
            "requests": {
              "memory": "32Mi"
            }
          },
          "node-driver-registrar": {
            "requests": {
              "memory": "32Mi"
            }
          },
          "longhorn-liveness-probe": {
            "requests": {
              "memory": "32Mi"
            }
          }
        }
