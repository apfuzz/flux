apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: https://vault.gangsterkitties.com
      path: gangsterkitties
      version: v2
      auth:
        kubernetes:
          mountPath: eso-fivealive
          role: kubernetes
          serviceAccountRef:
            name: openbao
            namespace: openbao
            audiences:
              - openbao
          secretRef:
            name: openbao-token
            key: token
