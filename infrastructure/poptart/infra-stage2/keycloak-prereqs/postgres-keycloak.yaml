---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-keycloak
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-keycloak
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "keycloak"
        password: "{{ .password | toString }}"
  data:
  - secretKey: password
    remoteRef:
      conversionStrategy: Default
      key: cnpg
      property: keycloak
