---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 15m
  values:
    ingressRoute:
      dashboard:
        annotations:
          external-dns.kubernetes.io/target: poptart-ingress2.gangsterkitties.com
        matchRule: Host(`poptart-traefik.gangsterkitties.com`)
    accessLog:
      enabled: false  # disabled by default - set this to true to enable
    service:
      annotations:
        external-dns.kubernetes.io/hostname: poptart-ingress2.gangsterkitties.com
        lbipam.cilium.io/ips: 10.0.102.252
