apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cilium-policy-drops
  namespace: cilium
  labels:
    release: kps
spec:
  groups:
    - name: cilium.network-policy
      rules:
        - alert: CiliumNetworkPolicyDrops
          expr: |
            sum by (node, source, destination) (
              increase(hubble_drop_total{reason="POLICY_DENIED"}[5m])
            ) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Cilium policy denied traffic to {{ $labels.destination }}"
            description: >-
              Traffic from {{ $labels.source }} to
              {{ $labels.destination }} was denied by a Cilium
              network policy on {{ $labels.node }} within the
              last five minutes.
