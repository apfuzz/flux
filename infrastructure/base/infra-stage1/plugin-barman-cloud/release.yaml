---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
    - name: cloudnative-pg
      namespace: cnpg-system
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.8.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
