---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: logging
spec:
  interval: 15m
  values:
    deploymentMode: SingleBinary
    loki:
      commonConfig:
        replication_factor: 1
      storage:
        type: s3
        bucketNames:
          chunks: loki-chunks-87836769
          ruler: loki-ruler-87836769
        s3:
          endpoint: https://vhcompat.objectstorage.us-ashburn-1.oci.customer-oci.com
          region: us-ashburn-1
          accessKeyId: "${AWS_ACCESS_KEY_ID}"
          secretAccessKey: "${AWS_SECRET_ACCESS_KEY}"
      schemaConfig:
        configs:
          - from: "2024-04-01"
            object_store: s3
            store: tsdb
            schema: v13
            index:
              prefix: index_
              period: 24h
      rulerConfig:
        alertmanager_url: http://kps-alertmanager.monitoring.svc.cluster.local:9093
    ingress:
      enabled: true
      ingressClassName: cilium
      annotations:
        external-dns.alpha.kubernetes.io/target: fivealive-ingress.gangsterkitties.com
      hosts:
        - loki.gangsterkitties.com
      tls:
        - hosts:
            - loki.gangsterkitties.com
    singleBinary:
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: loki-oci-credentials
      persistence:
        storageClass: longhorn
    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0
    chunksCache:
      allocatedMemory: 1024
    monitoring:
      dashboards:
        # enabled: true
        enabled: false
      serviceMonitor:
        enabled: true
        labels:
          release: kps
    ruler:
      directories:
        fake:
          app-alerts.yaml: |
            groups:
              - name: talos-nvme
                interval: 1m
                rules:
                  - alert: LokiRulerTest
                    expr: |
                      sum(count_over_time({job="talos"}[5m])) > 0
                    labels:
                      severity: warning
                      test: "true"
                    annotations:
                      summary: "Loki ruler test alert"
                      description: "Temporary alert confirming Loki rule evaluation and Alertmanager delivery."

                  - alert: TalosNVMeControllerFailure
                    expr: |
                      sum by (talos_server) (
                        count_over_time(
                          {job="talos", talos_service="kernel"}
                            |~ "(?i)nvme.*(timeout|reset controller|device not ready|aborting reset|not ready .* after FLR)"
                          [2m]
                        )
                      ) > 0
                    labels:
                      severity: critical
                    annotations:
                      summary: "NVMe controller failure on {{ $labels.talos_server }}"
                      description: "Talos kernel logs indicate an NVMe controller timeout/reset or failed recovery on {{ $labels.talos_server }}."
