apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: roundcube-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: roundcube

  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP

    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
